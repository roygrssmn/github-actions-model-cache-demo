name: Quantized model cache demo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quantized-model-cache.yml'

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_PATH: .cache/qwen/qwen2.5-1.5b-instruct-q4_k_m.gguf
      MODEL_REVISION: 91cad51170dc346986eccefdc2dd33a9da36ead9
      MODEL_SHA256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
      MAX_MODEL_BYTES: '1500000000'
      LLAMA_CPP_RELEASE: b12250
      LLAMA_CPP_SHA256: 5a2cb0188a3f392f88c5d226768abd0da7b2b6a5abdbb50abedcd7c8f42d9fb1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore quantized model cache
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: hf-qwen2.5-1.5b-q4_k_m-${{ env.MODEL_REVISION }}-${{ runner.os }}

      - name: Download model on cache miss
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          curl --fail --location --retry 3 --max-filesize "$MAX_MODEL_BYTES" \
            --output "$MODEL_PATH" \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/$MODEL_REVISION/$(basename "$MODEL_PATH")"

      - name: Verify model size and checksum
        run: |
          model_bytes=$(stat -c %s "$MODEL_PATH")
          echo "Model size: $model_bytes bytes (limit: $MAX_MODEL_BYTES bytes)"
          if [ "$model_bytes" -gt "$MAX_MODEL_BYTES" ]; then
            echo "Model exceeds the size limit" >&2
            exit 1
          fi
          printf '%s  %s\n' "$MODEL_SHA256" "$MODEL_PATH" | sha256sum --check

      - name: Download and verify prebuilt CPU inference runtime
        run: |
          archive="$RUNNER_TEMP/llama-$LLAMA_CPP_RELEASE.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_CPP_RELEASE/llama-$LLAMA_CPP_RELEASE-bin-ubuntu-x64.tar.gz"
          printf '%s  %s\n' "$LLAMA_CPP_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"

      - name: Run offline inference from the local GGUF file
        run: |
          completion=$(sudo unshare --net \
            --setuid "$(id -u)" --setgid "$(id -g)" -- \
            "$RUNNER_TEMP/llama-$LLAMA_CPP_RELEASE/llama-completion" \
            --model "$MODEL_PATH" --n-gpu-layers 0 --ctx-size 512 --predict 16 \
            --temp 0 --no-conversation --no-display-prompt \
            --prompt "The capital of France is")
          printf 'Generated text: %s\n' "$completion"
          if ! grep -iqw 'Paris' <<< "$completion"; then
            echo "Expected the model to generate Paris" >&2
            exit 1
          fi
          echo "PASS: generated the expected completion from the local GGUF file"
