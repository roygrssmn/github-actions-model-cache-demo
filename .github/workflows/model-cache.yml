name: Hugging Face model cache demo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore model cache
        id: model-cache
        uses: actions/cache@v6
        with:
          path: .cache/huggingface/hub
          key: hf-tiny-gpt2-v1-${{ runner.os }}

      - name: Display cache status
        run: |
          echo "Model cache hit: ${{ steps.model-cache.outputs.cache-hit }}"
          if [ "${{ steps.model-cache.outputs.cache-hit }}" = 'true' ]; then
            echo 'CACHE HIT: model files restored from GitHub Actions cache'
          else
            echo 'CACHE MISS: model files will be downloaded and cached after successful run'
          fi

      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --constraint requirements.txt torch
          python -m pip install -r requirements.txt

      - name: Run model test
        env:
          HF_HUB_OFFLINE: ${{ steps.model-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          echo "HF_HUB_OFFLINE=$HF_HUB_OFFLINE"
          python test_model.py
